name: uniservice
description: >
  UniService — plataforma que centraliza la oferta y demanda de servicios
  estudiantiles (tutorías, proyectos interdisciplinarios, logística) en un
  entorno seguro y verificado, para estudiantes de instituciones de
  educación superior en Valledupar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
